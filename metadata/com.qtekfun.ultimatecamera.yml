# DRAFT fdroiddata recipe (docs/04-ci-y-release.md). Not submitted yet: the app is a Phase 0 spike and no tag has a
# finished release. Before submitting to https://gitlab.com/fdroid/fdroiddata (as metadata/com.qtekfun.ultimatecamera.yml):
#   1. AllowedAPKSigningKeys holds the release certificate's SHA-256 (owner, 2026-10-16; also pinned in release.yml).
#   2. Uncomment the Builds entry for the release tag, with the tag's commit hash, versionName and versionCode.
#   3. BLOCKER: F-Droid's build server runs assembleRelease without our key and signs (or compares) the unsigned APK
#      itself, but checkReleaseSigning (app/build.gradle.kts) refuses any release build without a signing config.
#      An explicit opt-in for an unsigned (never debug-signed) release, e.g. a `gradleprops` entry, is the owner's
#      decision (docs/PROGRESS.md, D23 open question).
#   4. Run `fdroid lint` and `fdroid build --test com.qtekfun.ultimatecamera:<versionCode>` in an fdroiddata checkout.
# Reproducibility is checked on every PR by the "Reproducible release build" CI job (docs/TESTING.md).

